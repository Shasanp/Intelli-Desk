spring.datasource.url=jdbc:mysql://localhost:3306/intellidesk?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
# Expose message in error responses (safe — only explicit ResponseStatusException messages are included)
server.error.include-message=always
intellidesk.two-factor=true
